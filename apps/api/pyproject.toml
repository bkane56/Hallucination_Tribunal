[project]
name = "hallucination-tribunal-api"
version = "0.1.0"
description = "The Hallucination Tribunal - RAG-powered adversarial answer review API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.18",
    "httpx>=0.28.0",
    "chromadb>=0.5.0",
    "numpy>=2.0.0",
    "pypdf>=5.1.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    "rank-bm25>=0.2.2",
    "pyyaml>=6.0.0",
    "structlog>=24.4.0",
    "aiosqlite>=0.20.0",
    "tiktoken>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
]
openai = ["openai>=1.55.0"]
local-embeddings = ["sentence-transformers>=3.3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hallucination_tribunal"]

[tool.vercel]
entrypoint = "hallucination_tribunal.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/hallucination_tribunal"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 80
