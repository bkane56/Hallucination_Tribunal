services:
  api:
    build:
      context: ./apps/api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./apps/api/src:/app/src
    command: uv run uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    working_dir: /app

  web:
    build:
      context: ./apps/web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
    volumes:
      - ./apps/web/src:/app/src
      - ./apps/web/public:/app/public
    command: yarn dev --hostname 0.0.0.0 --port 3000
    depends_on:
      - api
