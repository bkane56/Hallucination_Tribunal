# Render Blueprint — Hallucination Tribunal API
# https://render.com/docs/blueprint-spec
#
# Production LLM and embeddings use OpenAI (set OPENAI_API_KEY in Render dashboard).
# Legacy Ollama env vars are retained but unused unless providers are switched back.
# UI deploys separately on Vercel; set NEXT_PUBLIC_BACKEND_URL to this service URL.

services:
  - type: web
    name: hallucination-tribunal-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    plan: free
    # plan: starter  # $7/mo — no cold starts; swap when upgrading
    healthCheckPath: /health
    disk:
      name: tribunal-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: LLM_PROVIDER
        value: openai
      - key: EMBEDDING_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: VECTOR_DB_PROVIDER
        value: chromadb
      - key: RETRIEVAL_MODE
        value: hybrid
      - key: LOG_LEVEL
        value: info
      - key: CHROMA_PERSIST_DIRECTORY
        value: /app/data/chroma
      - key: SQLITE_DATABASE_PATH
        value: /app/data/tribunal.db
      - key: UPLOAD_DIRECTORY
        value: /app/data/uploads
      - key: SEED_DIRECTORY
        value: /app/data/seed
      - key: EVALS_DIRECTORY
        value: /app/data/evals
